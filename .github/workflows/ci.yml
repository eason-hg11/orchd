name: CI

# Unit tests, compile and an isolated install of the built wheel (issue #7).
# No daemon, Orch or worker is started and no provider account is used; passing CI is not
# end-to-end acceptance. See docs/install-verification.md for the manual new-machine checklist.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (Linux, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Compile
        run: python -m compileall -q orchd scripts tests

  windows-tests:
    # The full suite on native Windows. Tests of POSIX-only behaviour (signals, process groups, file modes,
    # AF_UNIX peers, FIFOs) skip with a reason from tests/portability.py; native-portability.yml keeps the
    # Windows-specific smoke tests.
    name: Unit tests (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests

  package:
    # Native Windows runs the build and wheel install here; the full Windows unit suite is windows-tests.
    name: Build and isolated wheel install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Check wheel contents, isolated install, --help and pre-init doctor
        run: python -I scripts/check-package.py dist
